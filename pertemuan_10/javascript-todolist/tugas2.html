<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Tugas 2 - Form Pendataan Praktikan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-4">
        <h2>Tugas 2 - Pendataan Praktikan PPW</h2>
        <hr>

        <button class="btn btn-primary mb-3" onclick="mulaiPendataan()">Mulai Pendataan</button>

        <div id="hasil"></div>
    </div>

    <script>
        function mulaiPendataan() {
            var jawab = confirm("Apakah Anda mahasiswa PPW1?");

            if (jawab == true) {
                var nama = prompt("Masukkan Nama Anda:");
                var nim = prompt("Masukkan NIM Anda:");
                var angkatan = prompt("Masukkan Angkatan Anda (contoh: 2024):");

                if (nama == null || nim == null || angkatan == null) {
                    alert("Data tidak lengkap!");
                    return;
                }
                if (nama == "" || nim == "" || angkatan == "") {
                    alert("Data tidak boleh kosong!");
                    return;
                }

                var tahunLulus = parseInt(angkatan) + 4;
                var tahunSekarang = 2026;
                var sisaTahun = tahunLulus - tahunSekarang;

                var nimAngka = parseInt(nim);
                var jenisNim = "";
                if (nimAngka % 2 == 0) {
                    jenisNim = "Genap";
                } else {
                    jenisNim = "Ganjil";
                }

                var pesanLulus = "";
                if (sisaTahun > 0) {
                    pesanLulus = sisaTahun + " tahun lagi";
                } else if (sisaTahun == 0) {
                    pesanLulus = "Tahun ini lulus!";
                } else {
                    pesanLulus = "Sudah lewat " + Math.abs(sisaTahun) + " tahun (harusnya sudah lulus)";
                }

                var tabelHTML = "";
                tabelHTML += "<h4>Data Praktikan</h4>";
                tabelHTML += "<table class='table table-bordered table-striped'>";
                tabelHTML += "<thead class='table-dark'>";
                tabelHTML += "<tr><th>Keterangan</th><th>Data</th></tr>";
                tabelHTML += "</thead>";
                tabelHTML += "<tbody>";
                tabelHTML += "<tr><td>Nama</td><td>" + nama + "</td></tr>";
                tabelHTML += "<tr><td>NIM</td><td>" + nim + "</td></tr>";
                tabelHTML += "<tr><td>Angkatan</td><td>" + angkatan + "</td></tr>";
                tabelHTML += "<tr><td>Perkiraan Tahun Lulus</td><td>" + tahunLulus + "</td></tr>";
                tabelHTML += "<tr><td>Sisa Waktu Lulus</td><td>" + pesanLulus + "</td></tr>";
                tabelHTML += "<tr><td>NIM Genap/Ganjil</td><td>" + jenisNim + "</td></tr>";
                tabelHTML += "</tbody>";
                tabelHTML += "</table>";

                document.getElementById("hasil").innerHTML = tabelHTML;

                console.log("Nama: " + nama);
                console.log("NIM: " + nim + " (" + jenisNim + ")");
                console.log("Angkatan: " + angkatan);
                console.log("Lulus: " + pesanLulus);

            } else {
                var pesanTolak = "";
                pesanTolak += "<div class='alert alert-danger text-center'>";
                pesanTolak += "<h3>Akses Ditolak!</h3>";
                pesanTolak += "<p>Maaf, halaman ini khusus untuk mahasiswa PPW1.</p>";
                pesanTolak += "<p>Silakan kembali ke planet Anda.</p>";
                pesanTolak += "<p><i>\"Bukan mahasiswa PPW1? Coba lagi semester depan ya!\"</i></p>";
                pesanTolak += "</div>";

                document.getElementById("hasil").innerHTML = pesanTolak;
            }
        }
    </script>

</body>
</html>
