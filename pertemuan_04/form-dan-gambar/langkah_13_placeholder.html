<!doctype html>
<html>
  <head>
    <title>Langkah 13: Attribute Placeholder</title>
  </head>
  <body>
    <h2>Attribute Placeholder</h2>
    <form>
      <label for="phone">Enter a phone number:</label>
      <input
        type="tel"
        id="phone"
        name="phone"
        placeholder="123-45-678"
        pattern="[0-9]{3}-[0-9]{2}-[0-9]{3}"
      />
    </form>
  </body>
</html>
