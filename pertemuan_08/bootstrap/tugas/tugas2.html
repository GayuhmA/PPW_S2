<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulir Pendaftaran Mahasiswa Baru</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container mt-5 mb-5">
      <h2 class="mb-4">Formulir Pendaftaran Mahasiswa Baru</h2>

      <div
        class="alert alert-success alert-dismissible fade show d-none"
        role="alert"
        id="successAlert"
      >
        <strong>Berhasil!</strong> Formulir pendaftaran berhasil disimpan.
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="alert"
          aria-label="Close"
        ></button>
      </div>

      <div class="card shadow-sm">
        <div class="card-body p-4">
          <form action="#" method="POST">
            <div class="row mb-3">
              <div class="col-md-6">
                <label for="namaLengkap" class="form-label">Nama Lengkap</label>
                <input
                  type="text"
                  class="form-control is-valid"
                  id="namaLengkap"
                  placeholder="Masukkan nama lengkap"
                  value="John Doe"
                  required
                />
                <div class="valid-feedback">Nama terlihat valid!</div>
              </div>
              <div class="col-md-6 mt-3 mt-md-0">
                <label for="nim" class="form-label">NIM</label>
                <input
                  type="text"
                  class="form-control is-invalid"
                  id="nim"
                  placeholder="Masukkan NIM"
                  value="123"
                  required
                />
                <div class="invalid-feedback">
                  NIM harus berisi minimal 9 digit angka.
                </div>
              </div>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input
                type="email"
                class="form-control"
                id="email"
                placeholder="name@example.com"
                required
              />
            </div>

            <div class="mb-3">
              <label for="programStudi" class="form-label">Program Studi</label>
              <select class="form-select" id="programStudi" required>
                <option value="" selected disabled>Pilih Program Studi</option>
                <option value="Teknik Informatika">Teknik Informatika</option>
                <option value="Sistem Informasi">Sistem Informasi</option>
                <option value="Teknologi Informasi">Teknologi Informasi</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="semester" class="form-label">Semester</label>
              <select class="form-select" id="semester" required>
                <option value="" selected disabled>Pilih Semester</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="alamat" class="form-label">Alamat</label>
              <textarea
                class="form-control"
                id="alamat"
                rows="3"
                placeholder="Masukkan alamat lengkap"
                required
              ></textarea>
            </div>

            <div class="mb-4">
              <label for="fotoProfil" class="form-label">Foto Profil</label>
              <input
                class="form-control"
                type="file"
                id="fotoProfil"
                accept="image/*"
                required
              />
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary">Simpan</button>
              <button type="reset" class="btn btn-outline-secondary">
                Reset
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const formRegistration = document.querySelector("form");
      const successAlert = document.getElementById("successAlert");

      formRegistration.addEventListener("submit", function (e) {
        e.preventDefault();
        successAlert.classList.remove("d-none");
        window.scrollTo(0, 0);
      });
    </script>
  </body>
</html>
